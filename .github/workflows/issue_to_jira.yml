name: Create JIRA issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  call-workflow-create-jira-issue:
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-jira-issue_to_jira.yml@76fff83021bd2c94c34dda6667a7b06a28c8c48d # v3.13.5
    permissions:
      contents: read
      issues: write
    with:
      project-key: 'GEOPY'
      components: '[{"name": "curve-apps"}]'
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN_WRITE }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL_WRITE }}
