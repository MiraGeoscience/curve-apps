name: Python analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-static-analysis:
    name: Static analysis
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-static_analysis.yml@76fff83021bd2c94c34dda6667a7b06a28c8c48d # v3.13.5
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'conda'
      app-name: 'curve_apps'
      python-version: '3.12'
  call-workflow-pytest:
    name: Pytest
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-pytest.yml@76fff83021bd2c94c34dda6667a7b06a28c8c48d # v3.13.5
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'conda'
      python-versions: '["3.12", "3.13"]'
      os: '["ubuntu-latest", "windows-latest"]'
      cache-number: 1
      codecov-reference-python-version: '3.12'
      codecov-reference-os: '["windows-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
