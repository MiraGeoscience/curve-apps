name: JIRA actions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  call-workflow-pr_jira_actions:
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-jira-pr_actions.yml@76fff83021bd2c94c34dda6667a7b06a28c8c48d # v3.13.5
    permissions:
      contents: read
      pull-requests: write
    secrets:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
